<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sift — Picture Organizer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E0F12">
<meta name="description" content="Sift through your camera roll fast — keep, archive, trash, or sort photos into your own folders. All on your device.">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --accent: #E8A33D; --keep: #4FB573; --trash: #E5544D; --later: #8E93A3; --archive: #5B8DEF; }
  body[data-theme="charcoal"] { --bg: #141519; --stage: #0E0F12; --surface: #1C1E24; --surface2: #25272F; --line: #2C2F38; --text: #E8E9EC; --dim: #9A9EAB; --faint: #6B6F7B; }
  body[data-theme="black"]    { --bg: #000000; --stage: #000000; --surface: #121212; --surface2: #1B1B1B; --line: #272727; --text: #EDEDED; --dim: #9B9B9B; --faint: #6E6E6E; }
  body[data-theme="warm"]     { --bg: #181412; --stage: #100D0B; --surface: #221C18; --surface2: #2B241E; --line: #362C25; --text: #ECE7E1; --dim: #A89E93; --faint: #7A7065; }
  body[data-theme="midnight"] { --bg: #0B1022; --stage: #070A16; --surface: #151B30; --surface2: #1D2542; --line: #2A3358; --text: #E9ECF8; --dim: #99A3C6; --faint: #69739A; }
  body[data-theme="light"]    { --bg: #F4F5F8; --stage: #E9EBF0; --surface: #FFFFFF; --surface2: #ECEEF3; --line: #E0E3EB; --text: #181A20; --dim: #5C6270; --faint: #969BA8; }
  body[data-theme="sand"]     { --bg: #F1E9DC; --stage: #E6DCC9; --surface: #FFFDF9; --surface2: #EFE6D6; --line: #E1D6C3; --text: #2A2017; --dim: #7C705D; --faint: #AA9D86; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Instrument Sans", system-ui, sans-serif;
    color: var(--text);
    overflow: hidden; font-size: 14px;
    background: #0a0b14;
    background-image: radial-gradient(120% 90% at 18% 0%, #2a2350 0%, rgba(42,35,80,0) 45%), radial-gradient(120% 90% at 100% 100%, #143047 0%, rgba(20,48,71,0) 48%), linear-gradient(160deg, #0d0f1c 0%, #08090f 100%);
  }
  #root { height: 100%; }
  .app { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg); }

  /* ============ Desktop OS chrome ============ */
  .desktop { height: 100%; display: flex; flex-direction: column; position: relative; }
  .menubar { height: 26px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
    font-family: "Instrument Sans", system-ui, sans-serif; font-size: 12.5px; color: rgba(255,255,255,0.92);
    background: rgba(16,16,24,0.5); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); border-bottom: 1px solid rgba(255,255,255,0.07); z-index: 5; }
  .mb-left, .mb-right { display: flex; align-items: center; gap: 17px; }
  .mb-logo { font-size: 13px; }
  .mb-app { font-weight: 700; }
  .mb-item { opacity: 0.82; }
  .stage-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px 16px 6px; }
  .window { width: 100%; height: 100%; max-width: 1480px; display: flex; flex-direction: column; background: var(--bg);
    border: 1px solid rgba(255,255,255,0.09); border-radius: 13px; overflow: hidden;
    box-shadow: 0 50px 110px rgba(0,0,0,0.62), 0 6px 22px rgba(0,0,0,0.5); }
  .titlebar { height: 40px; flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 16px;
    background: var(--surface); border-bottom: 1px solid var(--line); }
  .traffic { display: flex; gap: 8px; }
  .tl { width: 12px; height: 12px; border-radius: 50%; }
  .tl.red { background: #ff5f57; } .tl.amber { background: #febc2e; } .tl.green { background: #28c840; }
  .title-text { text-align: center; font-size: 12.5px; color: var(--dim); font-weight: 600; letter-spacing: 0.01em; }
  .dock { flex: none; height: 58px; display: flex; align-items: center; justify-content: center; gap: 10px; padding-bottom: 8px; }
  .dock-app { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.09); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.13);
    transition: transform 0.13s ease; cursor: default; }
  .dock-app:hover { transform: translateY(-7px) scale(1.06); }
  .dock-app.active { background: linear-gradient(155deg, color-mix(in oklab, var(--accent) 82%, #fff), var(--accent)); border-color: transparent; box-shadow: 0 10px 24px color-mix(in oklab, var(--accent) 40%, transparent); }
  .dock-glyph { color: #16121a; font-size: 22px; line-height: 1; }
  .dock-icon.ph { background: linear-gradient(150deg,#7ad7ff,#3b7bd6); width: 24px; height: 24px; border-radius: 6px; }
  .dock-icon.fl { background: linear-gradient(150deg,#8fe3a8,#3ba564); width: 24px; height: 24px; border-radius: 6px; }
  .dock-icon.tr { background: linear-gradient(150deg,#cfd4de,#9aa0ad); width: 24px; height: 24px; border-radius: 6px; }
  .dock-sep { width: 1px; height: 32px; background: rgba(255,255,255,0.16); margin: 0 4px; }

  /* ============ Work area + folder rail ============ */
  .work { flex: 1; min-height: 0; display: flex; }
  .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: var(--dim); cursor: pointer; transition: background 0.12s, color 0.12s; flex: none; }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }
  .tb-avatar { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(145deg, color-mix(in oklab, var(--accent) 80%, #fff), var(--accent)); color: #16121a; font-weight: 700; font-size: 12px; }
  .plus-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 11px; font-size: 12px; }
  .plus-pill.on { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); }
  .seg.archive { background: var(--archive); }
  .progress-bar .pb.archive { background: var(--archive); }
  .archive-c { color: var(--archive); }
  .stat.archive-c { color: var(--archive); }

  .rail { width: 250px; flex: none; display: flex; flex-direction: column; gap: 7px; padding: 13px; background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; }
  .rail::-webkit-scrollbar { width: 6px; } .rail::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .rail.muted { opacity: 0.5; pointer-events: none; }
  .rail-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
  .rail-title { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }
  .rail-manage { display: inline-flex; background: none; border: none; color: var(--faint); cursor: pointer; padding: 4px; border-radius: 6px; }
  .rail-manage:hover { color: var(--text); background: var(--surface2); }
  .rail-scroll { flex: none; display: flex; flex-direction: column; gap: 6px; }
  .rail-target { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--surface2); color: var(--text); font: inherit; font-weight: 600; font-size: 13.5px; cursor: pointer;
    transition: border-color 0.12s, background 0.12s, transform 0.08s; text-align: left; flex: none; }
  .rail-target:hover { border-color: color-mix(in oklab, var(--accent) 50%, var(--line)); }
  .rail-target:active { transform: scale(0.985); }
  .rt-ico { display: inline-flex; flex: none; color: var(--dim); }
  .rt-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rt-count { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--faint); }
  .rail-target.keep { border-color: color-mix(in oklab, var(--keep) 45%, var(--line)); }
  .rail-target.keep .rt-ico { color: var(--keep); }
  .rail-target.archive .rt-ico { color: var(--archive); }
  .rail-target.trash .rt-ico { color: var(--trash); }
  .rail.dragging .rail-target { border-style: dashed; border-color: color-mix(in oklab, var(--accent) 40%, var(--line)); }
  .rail-target.over { border-style: solid; border-color: var(--accent); background: color-mix(in oklab, var(--accent) 16%, var(--surface2)); transform: scale(1.02); }
  .rail-target.trash.over { border-color: var(--trash); background: color-mix(in oklab, var(--trash) 16%, var(--surface2)); }
  .rail-target.archive.over { border-color: var(--archive); background: color-mix(in oklab, var(--archive) 16%, var(--surface2)); }
  .rail-add { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px dashed var(--line);
    background: transparent; color: var(--dim); font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
  .rail-add:hover { color: var(--text); border-color: var(--faint); }
  .rail-new { display: flex; gap: 6px; }
  .rail-new input { flex: 1; min-width: 0; min-height: 42px; border-radius: 10px; border: 1px solid var(--accent); background: var(--surface2); color: var(--text); font: inherit; font-size: 14px; padding: 0 10px; }
  .rail-new input:focus { outline: none; }

  .draggable { cursor: grab; }
  .draggable:active { cursor: grabbing; }
  .drag-hint { position: absolute; top: 14px; right: 16px; z-index: 4; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--faint);
    background: rgba(0,0,0,0.4); padding: 4px 9px; border-radius: 999px; opacity: 0; transition: opacity 0.15s; pointer-events: none; }
  .stage:hover .drag-hint { opacity: 0.85; }
  .photo-card .drag-hint { top: 22px; right: 22px; }
  .gate-veil { position: absolute; inset: 0; background: color-mix(in oklab, var(--stage) 78%, transparent); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); z-index: 3; }

  /* ============ Action bar archive button ============ */
  .act.archive { color: var(--archive); }
  .act.archive:hover { border-color: var(--archive); background: color-mix(in oklab, var(--archive) 12%, var(--surface2)); }
  .mono { font-family: "IBM Plex Mono", monospace; }

  /* ---------- Top bar ---------- */
  .topbar { display: flex; align-items: center; gap: 18px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
  .brand { display: flex; align-items: baseline; gap: 10px; flex: none; }
  .logo { font-weight: 700; letter-spacing: 0.18em; font-size: 14px; color: var(--accent); }
  .brand-sub { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--faint); }
  .progress-strip { display: flex; gap: 2px; flex: 1; height: 6px; min-width: 120px; }
  .seg { flex: 1; border-radius: 2px; background: var(--surface2); transition: background 0.15s; }
  .seg.keep { background: var(--keep); }
  .seg.trash { background: var(--trash); }
  .seg.later { background: var(--later); }
  .seg.current { background: var(--accent); }
  .progress-bar { position: relative; display: flex; flex: 1; height: 6px; min-width: 120px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .progress-bar .pb { height: 100%; }
  .progress-bar .pb.keep { background: var(--keep); }
  .progress-bar .pb.trash { background: var(--trash); }
  .progress-bar .pb.later { background: var(--later); }
  .progress-bar .pb-label { position: absolute; right: 6px; top: -16px; font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--faint); }
  .stats { display: flex; gap: 12px; font-family: "IBM Plex Mono", monospace; font-size: 11px; flex: none; }
  .keep-c { color: var(--keep); } .trash-c { color: var(--trash); } .later-c { color: var(--later); } .dim-c { color: var(--faint); }

  /* ---------- Stage ---------- */
  .stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: var(--stage); min-height: 0; overflow: hidden; }
  .photo-img { user-select: none; }

  .photo-bleed { position: absolute; inset: 0; }
  .photo-bleed .photo-img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .bleed-caption { position: absolute; left: 18px; bottom: 14px; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; background: rgba(0,0,0,0.55); border-radius: 6px; backdrop-filter: blur(4px); }

  .photo-card { position: relative; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 12px; max-width: min(78%, 1100px); max-height: 88%; box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
  .photo-card .photo-img { min-height: 0; max-width: 100%; object-fit: contain; border-radius: 6px; flex: 1; }
  .card-caption { display: flex; align-items: baseline; gap: 12px; flex: none; }

  .cap-name { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 500; color: var(--text); }
  .cap-meta { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--dim); }

  /* ---------- Video affordances ---------- */
  .media-badge { position: absolute; top: 16px; left: 16px; z-index: 4; display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px; background: rgba(0,0,0,0.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: #fff; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; letter-spacing: 0.02em; pointer-events: none; }
  .photo-card .media-badge { top: 22px; left: 22px; }
  .video-stage { position: relative; background: #000; }
  .photo-bleed .video-stage { position: absolute; inset: 0; }
  .photo-card .video-stage { flex: 1; min-height: 0; border-radius: 6px; overflow: hidden; }
  .video-stage .video-poster, .video-stage .video-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .video-stage .video-layer { transition: opacity 0.35s ease; }

  /* enter / exit motion */
  @media (prefers-reduced-motion: no-preference) {
    .enter { animation: sift-enter 0.18s ease-out; }
    .exit-keep { animation: sift-exit-keep 0.17s ease-in forwards; }
    .exit-trash { animation: sift-exit-trash 0.17s ease-in forwards; }
    .exit-later { animation: sift-exit-later 0.17s ease-in forwards; }
  }
  @keyframes sift-enter { from { transform: translateY(10px) scale(0.99); } to { transform: none; } }
  @keyframes sift-exit-keep { to { opacity: 0; transform: translateX(90px) rotate(1deg); } }
  @keyframes sift-exit-trash { to { opacity: 0; transform: translateX(-90px) rotate(-1deg); } }
  @keyframes sift-exit-later { to { opacity: 0; transform: translateY(70px); } }

  /* ---------- Stack compare ---------- */
  .stack-wrap { display: flex; flex-direction: column; gap: 14px; width: 100%; height: 100%; padding: 20px 24px 24px; }
  .stack-head { display: flex; align-items: center; gap: 16px; flex: none; }
  .stack-flag { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px; background: color-mix(in oklab, var(--accent) 16%, transparent); color: var(--accent); font-weight: 600; font-size: 12px; }
  .stack-hint { color: var(--dim); font-size: 13px; }
  .stack-grid { display: grid; gap: 14px; flex: 1; min-height: 0; grid-auto-rows: 1fr; align-content: stretch; justify-content: stretch; }
  .stack-cell { margin: 0; position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; transition: border-color 0.12s, transform 0.12s, box-shadow 0.12s; }
  .stack-cell:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 14px 34px rgba(0,0,0,0.4); }
  .stack-cell img { width: 100%; height: 100%; min-height: 0; object-fit: contain; flex: 1; user-select: none; background: var(--stage); }
  .stack-cell video { width: 100%; height: 100%; min-height: 0; object-fit: contain; flex: 1; background: var(--stage); }
  .stack-vid-badge { position: absolute; top: 8px; left: 8px; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px;
    border-radius: 50%; background: rgba(0,0,0,0.5); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); color: #fff; pointer-events: none; }
  .thumb-ph { background: var(--surface2); display: block; }
  .stack-cap { display: flex; align-items: center; gap: 9px; padding: 8px 10px; flex: none; background: var(--surface); }

  /* ---------- Action bar ---------- */
  .actionbar { display: flex; align-items: center; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--line); flex: none; min-height: 68px; }
  .ab-side { flex: 1; display: flex; align-items: center; gap: 8px; }
  .ab-side.right { justify-content: flex-end; }
  .ab-main { display: flex; gap: 10px; flex: none; }
  .act { display: inline-flex; align-items: center; gap: 9px; min-height: 46px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; transition: border-color 0.12s, background 0.12s, transform 0.06s; }
  .act:active { transform: scale(0.97); }
  .act.trash { color: var(--trash); }
  .act.trash:hover { border-color: var(--trash); background: color-mix(in oklab, var(--trash) 12%, var(--surface2)); }
  .act.keep { color: var(--keep); }
  .act.keep:hover { border-color: var(--keep); background: color-mix(in oklab, var(--keep) 12%, var(--surface2)); }
  .act.later { color: var(--later); }
  .act.later:hover { border-color: var(--later); background: color-mix(in oklab, var(--later) 12%, var(--surface2)); }

  .kbd { font-family: "IBM Plex Mono", monospace; font-size: 10px; line-height: 1; padding: 4px 5px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--dim); }
  .kbd.accent { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 40%, var(--line)); }

  .chip { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--dim); font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: border-color 0.12s, color 0.12s; }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip-hint { font-size: 11px; color: var(--faint); margin-left: 2px; }

  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface2); color: var(--text); font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; transition: border-color 0.12s, background 0.12s; }
  .btn:hover { border-color: var(--faint); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.ghost { background: transparent; color: var(--dim); }
  .btn.small { min-height: 30px; padding: 0 10px; font-size: 12px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #14130E; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { background: color-mix(in oklab, var(--trash) 16%, var(--surface2)); border-color: color-mix(in oklab, var(--trash) 50%, var(--line)); color: var(--trash); }
  .btn.danger:hover { border-color: var(--trash); }

  /* ---------- Filmstrip ---------- */
  .filmstrip { display: flex; gap: 6px; padding: 8px 16px; background: var(--bg); border-top: 1px solid var(--line); flex: none; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; }
  .filmstrip::-webkit-scrollbar { height: 6px; }
  .filmstrip::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .filmstrip::-webkit-scrollbar-track { background: transparent; }
  .thumb { position: relative; width: 74px; height: 48px; padding: 0; border-radius: 5px; overflow: hidden; flex: none; opacity: 0.5; border: 1.5px solid transparent; background: var(--surface2); cursor: pointer; transition: opacity 0.15s, border-color 0.15s, transform 0.1s; }
  .thumb:hover { opacity: 0.95; border-color: color-mix(in oklab, var(--accent) 55%, var(--line)); transform: translateY(-2px); }
  .thumb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.current { opacity: 1; border-color: var(--accent); }
  .thumb.current:hover { transform: none; }
  .thumb.done { opacity: 0.32; }
  .thumb.done:hover { opacity: 0.8; }
  .thumb-stack { position: absolute; top: 3px; right: 4px; display: inline-flex; align-items: center; gap: 3px; font-family: "IBM Plex Mono", monospace; font-size: 9px; padding: 2px 4px; border-radius: 3px; background: rgba(0,0,0,0.65); color: #fff; }
  .thumb-mark { position: absolute; left: 4px; bottom: 3px; display: inline-flex; padding: 2px; border-radius: 3px; background: rgba(0,0,0,0.65); }
  .thumb-mark.keep { color: var(--keep); } .thumb-mark.trash { color: var(--trash); } .thumb-mark.later { color: var(--later); }
  .thumb-vid { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.5); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); color: #fff; pointer-events: none; }

  /* ---------- Finish screen ---------- */
  .finish { flex: 1; overflow: auto; min-height: 0; }
  .finish-inner { max-width: 1060px; margin: 0 auto; padding: 36px 40px 80px; }
